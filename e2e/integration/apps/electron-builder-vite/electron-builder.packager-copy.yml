appId: com.example.electron-builder-vite-packager-copy
productName: electron-builder-vite-packager-copy
# On Linux, electron-builder derives the executable name from the npm package name, not productName.
# Set executableName explicitly so the binary matches the packagedBinary path declared in package.json.
executableName: electron-builder-vite-packager-copy
directories:
  output: out/packager-copy
files:
  - dist/packager-copy/**
  - package.json
extraMetadata:
  main: dist/packager-copy/main.js
linux:
  target: dir
mac:
  target: dir
  identity: null # disable code signing for integration test apps
win:
  target: dir
